services:
  db:
    image: postgres:15-alpine
    container_name: appbus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appbus_db}
      POSTGRES_USER: ${POSTGRES_USER:-appbus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appbus_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appbus_user} -d ${POSTGRES_DB:-appbus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appbus_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appbus_frontend
    restart: unless-stopped
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  postgres_data:
